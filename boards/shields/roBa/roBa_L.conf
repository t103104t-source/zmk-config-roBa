# NFC 用ピンを通常の GPIO として使う。
CONFIG_NFCT_PINS_AS_GPIOS=y
# 左エンコーダーの EC11 ドライバを有効にする。
CONFIG_EC11=y
# エンコーダーのイベント処理をグローバルスレッドで行う。
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# 左側のバッテリー残量を報告する。
CONFIG_ZMK_BATTERY_REPORTING=y

# ポインティングデバイス機能を有効にする。
CONFIG_ZMK_POINTING=y
# Zephyr の入力サブシステムを有効にする。
CONFIG_INPUT=y
