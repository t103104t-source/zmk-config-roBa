# Bluetooth 名として表示するキーボード名。
CONFIG_ZMK_KEYBOARD_NAME="roBa"

# ポインティングデバイス機能を有効にする。
CONFIG_ZMK_POINTING=y
# NFC 用ピンを通常の GPIO として使う。
CONFIG_NFCT_PINS_AS_GPIOS=y
# Bluetooth 通信を有効にする。
CONFIG_ZMK_BLE=y
# 2 Mbps PHY を無効にして Bluetooth 接続を安定させる。
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# Bluetooth の送信出力を最大の +8 dBm にする。
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y


# トラックボール通信用の SPI を有効にする。
CONFIG_SPI=y
# Zephyr の入力サブシステムを有効にする。
CONFIG_INPUT=y

# PMW3610 トラックボールのドライバを有効にする。
CONFIG_PMW3610=y
# トラックボールの基本分解能（CPI）。
CONFIG_PMW3610_CPI=400
# 基本 CPI に適用する分周値。
CONFIG_PMW3610_CPI_DIVIDOR=1
# センサーを 180 度回転した向きとして扱う。
CONFIG_PMW3610_ORIENTATION_180=y
# スナイプ（低速）モード用 CPI の設定例（現在は無効）。
# CONFIG_PMW3610_SNIPE_CPI=800
# スナイプ（低速）モード用 CPI 分周値の設定例（現在は無効）。
# CONFIG_PMW3610_SNIPE_CPI_DIVIDOR=4
# スクロール1目盛りに必要な移動量。
CONFIG_PMW3610_SCROLL_TICK=16
# X 軸の移動方向は反転しない。
CONFIG_PMW3610_INVERT_X=n
# 横スクロール方向は反転する。
CONFIG_PMW3610_INVERT_SCROLL_X=y
# 移動後、省電力へ移行するまでの時間（ms）。
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
# 1段階目の省電力時のサンプル間隔（ms）。
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
# 1段階目の省電力へ移行するまでの時間の設定例（現在は既定値）。
#CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=9600
# 2段階目の省電力時サンプル間隔の設定例。
#CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=
# 2段階目の省電力へ移行するまでの時間の設定例。
#CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=
# 3段階目の省電力時サンプル間隔の設定例。
#CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=
# 3段階目の省電力へ移行するまでの時間の設定例。
#CONFIG_PMW3610_REST3_DOWNSHIFT_TIME_MS=
# 常時起床モードの設定例（現在は無効）。
#CONFIG_PMW3610_FORCE_AWAKE=n
# ソフトウェアで 125 Hz のポーリングレートを使う。
CONFIG_PMW3610_POLLING_RATE_125_SW=y
# 自動マウスレイヤーを解除するまでの時間（ms）。
CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=10000

# 移動を検知するための最小しきい値（0 は最小）。
CONFIG_PMW3610_MOVEMENT_THRESHOLD=0

# センサー内蔵の移動補正アルゴリズムを有効にする。
CONFIG_PMW3610_SMART_ALGORITHM=y

# 左右共通で使う EC11 エンコーダードライバを有効にする。
CONFIG_EC11=y
# エンコーダーのイベント処理をグローバルスレッドで行う。
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# バッテリー残量を Bluetooth 経由で報告する。
CONFIG_ZMK_BATTERY_REPORTING=y
# Windows に標準の Battery Service を公開する。
CONFIG_BT_BAS=y
# 子機のバッテリー残量を親機が取得する。
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# 取得した子機の残量を追加の Battery Service としてホストへ公開する。
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
# Windows がバッテリー通知を購読しない場合でも残量を通知する。
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# ZMK Studio からのキー配置編集を有効にする。
CONFIG_ZMK_STUDIO=y
# ZMK Studio の編集ロックを無効にする。
CONFIG_ZMK_STUDIO_LOCKING=n 

